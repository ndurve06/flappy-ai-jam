name: Committee-assisted Build
description: For committee members entering a game for a participant at the help desk.
title: "[Game] "
labels: ["submission", "committee-assisted"]
body:
  - type: markdown
    attributes:
      value: Enter the game name in the issue title. Provide a playable link, full single-file HTML, or both. Test the game and confirm the team agrees to publish these details and any supplied code.
  - type: input
    id: builder
    attributes:
      label: Name or team name
      placeholder: Team Seagull
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What did you ask the AI to change?
      description: Copy the request you sent, or describe it in one sentence.
      placeholder: I asked it to make the game look like a museum at night.
    validations:
      required: true
  - type: input
    id: game_url
    attributes:
      label: Link to play your game
      description: Enter the live GitHub Pages URL or any public link that opens the game. This works for games with multiple files. You can also enter a Canvas share link.
      placeholder: https://your-username.github.io/your-game/
  - type: textarea
    id: game_html
    attributes:
      label: Single-file HTML
      description: Optional if you gave a game link. Paste the complete index.html without code fences. If your game uses additional files or the HTML is over 50,000 characters, use the live link above.
      render: html
