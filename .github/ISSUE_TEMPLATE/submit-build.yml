name: Submit Your Build
description: Send your game to the Flappy AI Jam gallery.
title: "[Game] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: Enter your game name in the issue title above. Your team name, AI request and game link will be public.
  - type: input
    id: builder
    attributes:
      label: Name or team name
      placeholder: Team Seagull
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What did you ask the AI to change?
      description: Copy the request you sent, or describe it in one sentence.
      placeholder: I asked it to make the game look like a museum at night.
    validations:
      required: true
  - type: input
    id: game_url
    attributes:
      label: Link to play your game
      description: Paste only the link from Canvas Share → Copy link or the direct link to your published game. Check that someone can play it in a private browser window.
      placeholder: https://share.gemini.google/…
    validations:
      required: true
