name: Submit Your Build
description: Send your game to the Flappy AI Jam gallery.
title: "[Game] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: Put your game name in the title above. Only share details you want in the public gallery.
  - type: input
    id: builder
    attributes:
      label: Name or team name
      placeholder: Team Seagull
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What did you ask the AI to change?
      description: Copy the request you sent, or describe it in one sentence.
      placeholder: I asked it to make the game look like a museum at night.
    validations:
      required: true
  - type: input
    id: game_url
    attributes:
      label: Link to play your game
      description: Use the share link from Canvas or a link to your published game. Try opening it in a private browser window first.
      placeholder: https://g.co/gemini/share/…
    validations:
      required: true
