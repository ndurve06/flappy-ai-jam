name: Publish Jam Showcase

on:
  issues:
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Event operation
        type: choice
        default: deploy
        options: [deploy, open-voting, close-voting, publish-winners]
      technical_id:
        description: 'Best Engineered build ID or #ballot number'
        type: string
      creative_id:
        description: 'Most Unhinged Prompt build ID or #ballot number'
        type: string
      paper_votes:
        description: 'Paper tally for close-voting (e.g. 1=4, 2=3)'
        type: string

permissions: {}

concurrency:
  group: flappy-ai-jam-pages
  queue: max

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issues' || github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: read
    outputs:
      issue: ${{ steps.submission.outputs.issue }}
      build: ${{ steps.submission.outputs.build }}
      publishing_source: ${{ steps.pages_source.outputs.type }}
      page_url: ${{ steps.pages_source.outputs.url }}
      revision: ${{ steps.revision.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Ensure form and approval labels exist
        if: github.event_name != 'issues'
        run: |
          set -euo pipefail
          labels=$(gh label list --limit 1000 --json name --jq '.[].name')
          if ! grep -Fxq submission <<< "$labels"; then
            gh label create submission --color 073B5C --description 'Flappy AI Jam gallery submission'
          fi
          if ! grep -Fxq approved <<< "$labels"; then
            gh label create approved --color A7BFB4 --description 'Reviewed for publication in the Flappy AI Jam gallery'
          fi
          if ! grep -Fxq audience-ballot <<< "$labels"; then
            gh label create audience-ballot --color 668998 --description 'Official Flappy AI Jam audience ballot'
          fi
          if ! grep -Fxq committee-assisted <<< "$labels"; then
            gh label create committee-assisted --color F7F5F0 --description 'Submitted on behalf of an attendee'
          fi
      - name: Detect the Pages publishing source
        id: pages_source
        run: |
          set -euo pipefail
          pages=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          type=$(jq -r .build_type <<< "$pages")
          if [[ "$type" != workflow ]] &&
             ! jq -e '.source.branch == "main" and .source.path == "/"' <<< "$pages" >/dev/null; then
            echo '::error::Pages must publish from GitHub Actions or from main / (root).'
            exit 1
          fi
          printf 'type=%s\nurl=%s\n' "$type" "$(jq -r .html_url <<< "$pages")" >> "$GITHUB_OUTPUT"
      - name: Publish approved submission or update the event
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy')
        id: submission
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            if [[ "$EVENT_NAME" == issues ]]; then
              python3 .github/scripts/publish_submission.py
            else
              python3 .github/scripts/manage_event.py
            fi
            git add -- submissions/manifest.json submissions/event.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: update Flappy AI Jam event'
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard FETCH_HEAD
          done
      - name: Record the revision to publish
        id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Stage event pages and playable builds
        if: steps.pages_source.outputs.type == 'workflow'
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/jam-pages"
          mkdir -p "$site/submissions"
          cp index.html arcade.html showcase.html vote.html "$site/"
          cp -r event examples "$site/"
          cp submissions/manifest.json submissions/event.json "$site/submissions/"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.pages_source.outputs.type == 'workflow'
        with:
          path: ${{ runner.temp }}/jam-pages

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ needs.stage.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: needs.stage.outputs.publishing_source == 'workflow'
      - name: Publish to branch-based Pages
        if: needs.stage.outputs.publishing_source != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.stage.outputs.revision }}
        run: |
          set -euo pipefail
          builds="repos/$GITHUB_REPOSITORY/pages/builds"
          latest=$(gh api "$builds/latest" || echo '{}')
          if ! jq -e --arg commit "$REVISION" '.commit == $commit and .status != "errored"' <<< "$latest" >/dev/null; then
            gh api --method POST "$builds" --jq .status
          fi
          for attempt in {1..36}; do
            if latest=$(gh api "$builds/latest") &&
               status=$(jq -r --arg commit "$REVISION" 'select(.commit == $commit) | .status' <<< "$latest"); then
              case "$status" in
                built) exit 0 ;;
                errored)
                  jq -r '.error.message // "Pages build failed."' <<< "$latest" >&2
                  exit 1 ;;
              esac
            fi
            sleep 5
          done
          echo '::error::Timed out waiting for Pages to publish the event update.'
          exit 1

  notify:
    needs: [stage, deploy]
    if: needs.stage.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ needs.stage.outputs.issue }}
      BUILD: ${{ needs.stage.outputs.build }}
      PAGE_URL: ${{ needs.stage.outputs.page_url }}
    steps:
      - name: Post the live gallery link
        run: |
          set -euo pipefail
          marker='<!-- flappy-ai-jam:published -->'
          endpoint="repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments"
          posted=$(gh api --paginate "$endpoint" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          if grep -Fq "$marker" <<< "$posted"; then exit 0; fi
          printf 'Your build is live: %s/showcase.html?build=%s\n\n%s\n' "${PAGE_URL%/}" "$BUILD" "$marker" |
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file -
