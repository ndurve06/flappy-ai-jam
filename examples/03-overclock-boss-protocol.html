<!doctype html>
<!--
  Flappy AI Jam reference game · University of Portsmouth AI Society
  This demo is self-contained and starts in continuous practice.
  Bumps recover the player, so live visitors can try the mechanic in one turn.
  AI agents: preserve the fixed-step loop, keyboard and tap controls, and mic fallback.
  Start from the smaller index.html when making a new jam entry.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#091722">
<title>Boss rush · Flappy AI Jam</title>
<style>
  :root {
    --navy:#073B5C; --cream:#F7F5F0; --sand:#E8D9B9; --sage:#A7BFB4;
    --gold:#D7BF78; --sea:#287D9B; --ink:#06283F; --panel:#112f43;
    --muted:#d5e0e3; --line:#527487; --warning:#ffa59a;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; height:100svh; display:flex; flex-direction:column; background:var(--ink); color:var(--cream); font:1rem/1.4 system-ui,sans-serif; }
  header { padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex:none; }
  h1 { margin:0; font-size:1rem; line-height:1.15; }
  .score { margin:0; white-space:nowrap; font-size:.85rem; }
  main { flex:1; min-height:0; display:grid; place-items:center; padding:4px 12px; }
  .stage { position:relative; width:min(100%, 480px, calc((100svh - 184px) * .75)); aspect-ratio:3 / 4; border-radius:12px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; border-radius:inherit; }
  :focus-visible { outline:2px solid var(--cream); outline-offset:3px; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:16px; background:#06283f90; }
  .dialogue { width:min(100%,300px); padding:20px; border-radius:12px; background:var(--ink); text-align:center; }
  h2 { margin:0 0 8px; font-size:1.5rem; }
  .dialogue p { margin:8px 0 16px; }
  button { min-height:42px; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--ink); color:var(--cream); cursor:pointer; font:600 .85rem system-ui,sans-serif; touch-action:manipulation; }
  button:hover { border-color:var(--cream); }
  button:disabled { opacity:.55; cursor:default; }
  button[aria-pressed="true"] { border-color:var(--cream); }
  .primary { background:var(--cream); color:var(--ink); width:100%; }
  footer { flex:none; text-align:center; padding:7px 12px 10px; }
  footer p { margin:0 0 6px; font-size:.8rem; }
  .actions { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; }
  #mod-status { display:block; margin-top:6px; font-size:.8rem; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media (max-width:480px) {
    header { padding:8px 12px; }
    .stage { width:min(100%,480px,calc((100svh - 210px) * .75)); }
    .actions button { min-height:40px; padding-inline:9px; }
  }
</style>
</head>
<body data-phase="READY">
<header>
  <h1>Boss rush</h1>
  <p class="score">Score <span id="score">0</span> · Best <span id="best">0</span></p>
</header>
<main>
  <section class="stage" id="flight-deck" aria-label="Boss rush game">
    <canvas id="game" width="480" height="640" tabindex="0" role="img" aria-label="Boss rush game. Space, up arrow or tap to flap." aria-describedby="flight-controls">This game needs Canvas 2D.</canvas>
    <div class="overlay" id="overlay">
      <div class="dialogue">
        <h2 id="overlay-title">Meet the boss</h2>
        <p id="overlay-detail">Space or tap to flap. Shift or Dash gives you a short shield. Bumps let you keep playing.</p>
        <button class="primary" id="flight-action" type="button"><span id="flight-action-label">Play</span></button>
      </div>
    </div>
    <p class="sr-only" id="announcer" role="status"></p>
  </section>
</main>
<footer>
  <p id="flight-controls">SPACE / ↑ / TAP · SHIFT TO DASH</p>
  <p>Practice · bumps won’t end your turn</p>
  <div class="actions">
    <button id="mod-toggle" type="button">Dash</button>
    <button id="pause" type="button" disabled>Pause</button>
    <button id="mute" type="button" aria-pressed="false">Mute</button>
  </div>

</footer>
<noscript><p>Enable JavaScript to play.</p></noscript>
<script>
(() => {
  "use strict";

  const byId = (id) => document.getElementById(id);
  const canvas = byId("game");
  const ctx = canvas.getContext("2d", { alpha: false });
  const ui = {
    score: byId("score"), high: byId("best"), overlay: byId("overlay"), title: byId("overlay-title"),
    detail: byId("overlay-detail"), action: byId("flight-action"), actionLabel: byId("flight-action-label"),
    announcer: byId("announcer"), pause: byId("pause"), mute: byId("mute"),
  };
  if (!ctx) {
    ui.title.textContent = "Canvas 2D unavailable";
    ui.detail.textContent = "Open this file in a browser with Canvas 2D enabled.";
    ui.action.disabled = true;
    ui.mute.disabled = true;
    byId("mod-toggle").disabled = true;
    return;
  }

  // === AI PROMPT ZONE: CONFIG ===
  // Logical pixels, seconds and px/s². Keep the wide gaps and recovery for live play.
  const CONFIG = Object.freeze({
    width: 480,
    height: 640,
    step: 1 / 120,
    maxFrameDelta: 0.05,
    top: 42,
    bottom: 598,
    playerX: 137,
    playerY: 320,
    playerHalfWidth: 15,
    playerHalfHeight: 10,
    gravity: 820,
    thrust: 265,
    terminalSpeed: 360,
    gateWidth: 64,
    gateSpacing: 280,
    firstGateX: 620,
    gateSpeed: 120,
    maxGateSpeed: 150,
    gateSpeedPerPoint: 1,
    gap: 260,
    minGap: 240,
    gapPerPoint: 0.5,
    gapCenterDrift: 45,
    gatePoolSize: 6,
    particlePoolSize: 160,
    trailInterval: 1 / 36,
    recoverySeconds: 1.2,
    scoreKey: "03-overclock-boss-protocol-best",
    muteKey: "protocolAeroMuted",
  });

  // Read CSS once; resize and rendering reuse this immutable mirror of the palette.
  const css = getComputedStyle(document.documentElement);
  const token = (name) => css.getPropertyValue(name).trim();
  const BRAND_TOKENS = Object.freeze({
    navy: token("--navy"), cream: token("--cream"), sand: token("--sand"),
    sage: token("--sage"), gold: token("--gold"), sea: token("--sea"),
    ink: token("--ink"), panel: token("--panel"), muted: token("--muted"),
    line: token("--line"), warning: token("--warning"),
  });
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const mix = (a, b, alpha) => a + (b - a) * alpha;
  const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const PHASE = Object.freeze({ READY: "READY", RUNNING: "RUNNING", PAUSED: "PAUSED" });

  // File previews and sandboxed
  // frames can deny storage, so the in-memory score remains the source of truth.
  const storage = {
    read(key) {
      try { return window.localStorage.getItem(key); } catch { return null; }
    },
    write(key, value) {
      try { window.localStorage.setItem(key, String(value)); } catch { /* optional persistence */ }
    },
  };
  const savedScore = Number(storage.read(CONFIG.scoreKey));
  let highScore = Number.isSafeInteger(savedScore) && savedScore > 0 ? savedScore : 0;

  // === AI PROMPT ZONE: AUDIO ===
  // Frequency sweeps and short envelopes keep cues intelligible without external files.
  const CUES = {
    flap: [[0, 410, 255, .085, .12, "triangle"]],
    score: [[0, 660, 760, .09, .10, "sine"], [.065, 880, 995, .12, .10, "triangle"]],
    record: [[.19, 780, 850, .085, .09, "sine"], [.265, 990, 1100, .085, .09, "sine"],
      [.34, 1320, 1480, .14, .10, "triangle"]],
  };

  class SoundEngine {
    #context = null;
    #master = null;
    #muted = storage.read(CONFIG.muteKey) === "1";
    #resumePending = false;
    #unavailable = false;
    #voices = 0;

    get muted() { return this.#muted; }

    // Call directly inside a click, touch or key handler for autoplay policies.
    unlock() {
      if (this.#muted || this.#unavailable) return;
      if (!this.#context) {
        const Audio = window.AudioContext ?? window.webkitAudioContext;
        if (!Audio) {
          this.#unavailable = true;
          return;
        }
        try {
          this.#context = new Audio();
          this.#master = this.#context.createGain();
          this.#master.gain.value = .6;
          this.#master.connect(this.#context.destination);
        } catch {
          this.#unavailable = true;
          return;
        }
      }
      if (this.#context.state !== "running" && !this.#resumePending) {
        this.#resumePending = true;
        this.#context.resume().catch(() => {}).finally(() => { this.#resumePending = false; });
      }
    }

    toggle() {
      this.#muted = !this.#muted;
      storage.write(CONFIG.muteKey, this.#muted ? 1 : 0);
      if (!this.#muted) this.unlock();
      if (this.#master) {
        const now = this.#context.currentTime;
        const gain = this.#master.gain;
        gain.cancelScheduledValues(now);
        gain.setTargetAtTime(this.#muted ? 0 : .6, now, .012);
      }
      return this.#muted;
    }

    play(name) {
      if (this.#muted || this.#unavailable || this.#context?.state !== "running") return;
      const now = this.#context.currentTime;
      const notes = CUES[name];
      for (let i = 0; i < notes.length && this.#voices < 20; i++) {
        const [delay, from, to, duration, peak, waveform] = notes[i];
        const start = now + delay;
        const end = start + duration;
        const oscillator = this.#context.createOscillator();
        const envelope = this.#context.createGain();
        oscillator.type = waveform;
        oscillator.frequency.setValueAtTime(from, start);
        oscillator.frequency.exponentialRampToValueAtTime(to, end);
        envelope.gain.setValueAtTime(.0001, start);
        envelope.gain.exponentialRampToValueAtTime(peak, start + .012);
        envelope.gain.exponentialRampToValueAtTime(.0001, end);
        oscillator.connect(envelope).connect(this.#master);
        this.#voices++;
        oscillator.onended = () => {
          oscillator.disconnect();
          envelope.disconnect();
          this.#voices--;
        };
        oscillator.start(start);
        oscillator.stop(end + .012);
      }
    }
  }

  // === AI PROMPT ZONE: STATE ===
  class StateMachine {
    #phase = PHASE.READY;

    get phase() { return this.#phase; }

    transition(next) {
      const current = this.#phase;
      const allowed =
        (current === PHASE.READY && next === PHASE.RUNNING) ||
        (current === PHASE.RUNNING && next === PHASE.PAUSED) ||
        (current === PHASE.PAUSED && next === PHASE.RUNNING);
      if (!allowed) return false;
      this.#phase = next;
      return true;
    }
  }

  // === AI PROMPT ZONE: ENTITIES ===
  // Pool entries keep the same shape and identity across runs. Previous positions
  // belong to the fixed step; presentation interpolates without mutating them.
  const Entities = {
    player: { x: CONFIG.playerX, y: CONFIG.playerY, prevY: CONFIG.playerY, vy: 0, prevVy: 0 },
    gates: Array.from({ length: CONFIG.gatePoolSize }, () => ({
      active: false, scored: false, x: 0, prevX: 0, top: 0, bottom: 0,
    })),
    particles: Array.from({ length: CONFIG.particlePoolSize }, () => ({
      life: 0, duration: 0, x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0, size: 0, color: "",
    })),
  };
  const { player, gates, particles } = Entities;
  const playerView = Object.freeze({
    get x() { return player.x; },
    get y() { return player.y; },
    get vy() { return player.vy; },
    halfWidth: CONFIG.playerHalfWidth,
    halfHeight: CONFIG.playerHalfHeight,
  });
  const gateViews = gates.map((gate) => Object.freeze({
    get x() { return gate.x; },
    width: CONFIG.gateWidth,
    get top() { return gate.top; },
    get bottom() { return gate.bottom; },
    get scored() { return gate.scored; },
  }));
  const machine = new StateMachine();
  const sound = new SoundEngine();
  let score = 0;
  let runId = 0;
  let tick = 0;
  let thrustQueued = false;
  let runSeed = 0;
  let gateRandomState = 0;
  let particleCursor = 0;
  let trailTime = 0;
  let distance = 0;
  let prevDistance = 0;
  let gateSpeed = CONFIG.gateSpeed;
  let lastGateCenter = CONFIG.playerY;
  let firstGate = true;
  let recovery = 0;

  const stateView = Object.freeze({
    get phase() { return machine.phase; },
    get runId() { return runId; },
    get seed() { return runSeed; },
    get tick() { return tick; },
    get elapsed() { return tick * CONFIG.step; },
    get score() { return score; },
    get highScore() { return highScore; },
    player: playerView,
  });

  // === AI PROMPT ZONE: MOD_HOOKS ===
  // A single ordered registry means no per-frame filtering, closures or snapshots.
  const MOD_HOOKS = Object.freeze({
    onInit: null,
    onFlap: null,
    onUpdate: null,
    onRenderBackground: null,
    onRenderEntities: null,
    onScore: null,
    onCollision: null,
  });
  const hookNames = Object.keys(MOD_HOOKS);
  const mods = [];
  let inHook = false;

  function invoke(hook, first, second) {
    let gravityScale = 1;
    inHook = true;
    try {
      for (let i = 0; i < mods.length; i++) {
        const mod = mods[i];
        const callback = mod.hooks[hook];
        if (!callback) continue;
        try {
          if (hook === "onRenderBackground" || hook === "onRenderEntities") {
            ctx.save();
            ctx.beginPath();
            try { callback(ctx); } finally {
              ctx.restore();
              ctx.beginPath();
            }
          } else if (hook === "onUpdate") {
            const scale = callback(first, second);
            if (Number.isFinite(scale)) gravityScale = clamp(gravityScale * clamp(scale, -2, 2), -2, 2);
          } else if (hook === "onCollision") {
            callback(first, second);
          } else if (hook === "onScore") {
            callback(first);
          } else {
            callback();
          }
        } catch (error) {
          mods.splice(i--, 1);

          console.error("Protocol: Aero disabled mod " + mod.id + " in " + hook, error);
        }
      }
    } finally {
      inHook = false;
    }
    return gravityScale;
  }

  const GameModAPI = Object.freeze({
    register(id, hooks) {
      if (inHook) throw new Error("Register and dispose mods outside callbacks.");
      if (typeof id !== "string" || !/^[a-z0-9][a-z0-9-]{0,47}$/.test(id)) {
        throw new TypeError("Use a lowercase mod ID with letters, digits or hyphens.");
      }
      if (!hooks || typeof hooks !== "object" || mods.some((mod) => mod.id === id)) {
        throw new TypeError("Supply a hook object and a unique mod ID.");
      }
      const registered = Object.create(null);
      for (const name of hookNames) {
        const callback = hooks[name];
        if (callback === undefined) continue;
        if (typeof callback !== "function") throw new TypeError(name + " must be a function.");
        registered[name] = callback;
      }
      const mod = { id, hooks: registered };
      // A failed initializer never installs its mod or changes the active count.
      inHook = true;
      try {
        const init = registered.onInit;
        if (init) init();
      } catch (error) {
        console.error("Protocol: Aero could not initialize mod " + id, error);
        return () => false;
      } finally {
        inHook = false;
      }
      mods.push(mod);

      return () => {
        if (inHook) throw new Error("Register and dispose mods outside callbacks.");
        const index = mods.indexOf(mod);
        if (index === -1) return false;
        mods.splice(index, 1);

        return true;
      };
    },
  });

  // === AI PROMPT ZONE: PIPES / LEVEL ===
  function nextGateRandom() {
    // xorshift32. Keep cosmetic Math.random() calls off the gameplay RNG.
    gateRandomState ^= gateRandomState << 13;
    gateRandomState ^= gateRandomState >>> 17;
    gateRandomState ^= gateRandomState << 5;
    return (gateRandomState >>> 0) / 4294967296;
  }

  function spawnGate(x) {
    for (let i = 0; i < gates.length; i++) {
      const gate = gates[i];
      if (gate.active) continue;
      const halfGap = Math.max(CONFIG.minGap, CONFIG.gap - score * CONFIG.gapPerPoint) / 2;
      const center = firstGate ? CONFIG.playerY : clamp(
        lastGateCenter + (nextGateRandom() * 2 - 1) * CONFIG.gapCenterDrift,
        CONFIG.top + halfGap + 42, CONFIG.bottom - halfGap - 42,
      );
      gate.active = true;
      gate.scored = false;
      gate.x = gate.prevX = x;
      gate.top = center - halfGap;
      gate.bottom = center + halfGap;
      lastGateCenter = center;
      firstGate = false;
      return;
    }
    // If a student compresses gate spacing past capacity, the next tick can
    // retry after a gate leaves. Never overwrite a gate still in the arena.
  }

  function resetRun() {
    resetBoss();
    runId++;
    runSeed = Math.floor(Math.random() * 4294967296) || 1;
    gateRandomState = runSeed | 0;
    score = tick = recovery = 0;
    player.y = player.prevY = CONFIG.playerY;
    player.vy = player.prevVy = 0;
    distance = prevDistance = trailTime = 0;
    gateSpeed = CONFIG.gateSpeed;
    particleCursor = 0;
    firstGate = true;
    lastGateCenter = CONFIG.playerY;
    for (let i = 0; i < gates.length; i++) gates[i].active = false;
    for (let i = 0; i < particles.length; i++) particles[i].life = 0;
    spawnGate(CONFIG.firstGateX);
    syncScore();
  }

  function emitParticle(x, y, vx, vy, life, size, color) {
    // Overwrite the oldest emission if a burst fills the pool.
    const particle = particles[particleCursor];
    particleCursor = (particleCursor + 1) % particles.length;
    particle.x = particle.prevX = x;
    particle.y = particle.prevY = y;
    particle.vx = vx;
    particle.vy = vy;
    particle.life = particle.duration = life;
    particle.size = size;
    particle.color = color;
  }

  function trail() {
    emitParticle(player.x - 17, player.y + Math.random() * 6 - 3,
      -90 - Math.random() * 95, Math.random() * 42 - 21,
      .18 + Math.random() * .15, 2 + Math.random() * 2, BRAND_TOKENS.sage);
  }

  function burst(x, y, count, color) {
    if (motion.matches) return;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 32 + Math.random() * 115;
      emitParticle(x, y, Math.cos(angle) * speed - 35, Math.sin(angle) * speed,
        .24 + Math.random() * .27, 2 + Math.random() * 2, color);
    }
  }

  function moveParticles(dt) {
    for (let i = 0; i < particles.length; i++) {
      const particle = particles[i];
      if (particle.life <= 0) continue;
      particle.life -= dt;
      particle.prevX = particle.x;
      particle.prevY = particle.y;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 80 * dt;
    }
  }

  // === AI PROMPT ZONE: SCORE & RECOVERY ===
  function syncScore() {
    ui.score.textContent = String(score);
    ui.high.textContent = String(highScore);
  }

  function clearGate(gate) {
    gate.scored = true;
    score++;
    sound.play("score");
    if (score > highScore) {
      highScore = score;
      storage.write(CONFIG.scoreKey, highScore);
    }
    syncScore();
    burst(player.x - CONFIG.playerHalfWidth, player.y, 15, BRAND_TOKENS.gold);
    invoke("onScore", score);
  }

  // Demo practice recovers in the nearest gap. It never opens a game-over screen.
  // Collision recovery is timed in simulation seconds and cannot drain on pause.
  function breach(obstacle) {
    if (recovery > 0) return;
    recovery = CONFIG.recoverySeconds;
    player.y = player.prevY = obstacle ? (obstacle.top + obstacle.bottom) / 2 : CONFIG.playerY;
    player.vy = player.prevVy = 0;
    thrustQueued = false;
    burst(player.x, player.y, 10, BRAND_TOKENS.sage);
    invoke("onCollision", playerView, obstacle);
  }

  // === AI PROMPT ZONE: PHYSICS ===
  function simulate(dt) {
    tick++;
    recovery = Math.max(0, recovery - dt);
    player.prevY = player.y;
    player.prevVy = player.vy;
    prevDistance = distance;
    const gravityScale = invoke("onUpdate", dt, stateView);
    if (thrustQueued) {
      thrustQueued = false;
      player.vy = gravityScale < 0 ? CONFIG.thrust : -CONFIG.thrust;
      sound.play("flap");
      invoke("onFlap");
      burst(player.x - 16, player.y, 5, BRAND_TOKENS.sea);
    }

    player.vy = clamp(player.vy + CONFIG.gravity * gravityScale * dt,
      -CONFIG.terminalSpeed, CONFIG.terminalSpeed);
    if (dash > 0) player.vy = dashDirection * CONFIG.terminalSpeed;
    player.y += player.vy * dt;

    gateSpeed = boss.phase === "IDLE" ? Math.min(CONFIG.maxGateSpeed, CONFIG.gateSpeed + score * CONFIG.gateSpeedPerPoint) : 0;
    distance += gateSpeed * dt;
    let farthest = -CONFIG.gateWidth;
    for (let i = 0; i < gates.length; i++) {
      const gate = gates[i];
      if (!gate.active) continue;
      gate.prevX = gate.x;
      gate.x -= gateSpeed * dt;
      if (gate.x + CONFIG.gateWidth < 0) gate.active = false;
      farthest = Math.max(farthest, gate.x);
    }
    const spawnX = farthest + CONFIG.gateSpacing;
    if (boss.phase === "IDLE" && spawnX <= CONFIG.width + 24) spawnGate(spawnX);

    moveParticles(dt);
    if (!motion.matches) {
      trailTime += dt;
      while (trailTime >= CONFIG.trailInterval) {
        trailTime -= CONFIG.trailInterval;
        trail();
      }
    }

    const left = player.x - CONFIG.playerHalfWidth;
    const right = player.x + CONFIG.playerHalfWidth;
    const top = player.y - CONFIG.playerHalfHeight;
    const bottom = player.y + CONFIG.playerHalfHeight;
    if (top <= CONFIG.top || bottom >= CONFIG.bottom) {
      player.y = clamp(player.y, CONFIG.top + CONFIG.playerHalfHeight, CONFIG.bottom - CONFIG.playerHalfHeight);
      player.vy = player.prevVy = 0;
      breach(null);
      return;
    }
    for (let i = 0; i < gates.length; i++) {
      const gate = gates[i];
      if (gate.active && right >= gate.x && left <= gate.x + CONFIG.gateWidth &&
          (top <= gate.top || bottom >= gate.bottom)) {
        breach(gateViews[i]);
        return;
      }
    }
    if (bossHitsPlayer()) {
      breach(null);
      return;
    }
    // Collision takes precedence. Award only once, after the entire hull clears.
    for (let i = 0; i < gates.length; i++) {
      const gate = gates[i];
      if (gate.active && !gate.scored && gate.x + CONFIG.gateWidth < left) clearGate(gate);
    }
  }

  // === AI PROMPT ZONE: GRAPHICS ===
  // Cache reusable vector paths at startup and the gradient on backing-store resize.
  const droneHull = new Path2D("M-16 -1 L-9 -7 L3 -9 L11 -5 L16 0 L7 7 L-6 8 L-16 3 Z");
  const droneWing = new Path2D("M-7 -3 L6 -2 L1 4 L-11 5 Z");
  const city = new Path2D(
    "M0 412 V375 H18 V387 H30 V349 H44 V362 H60 V337 H70 V383 H92 V373 H103 V354 H114 V387 " +
    "H134 V367 H151 V340 H160 V373 H176 V391 H201 V371 H224 V383 H240 V348 H252 V357 H269 V387 " +
    "H285 V363 H299 V328 H308 V352 H321 V380 H345 V354 H360 V376 H373 V388 H391 V356 H402 V369 " +
    "H422 V341 H433 V373 H449 V383 H464 V360 H480 V412 Z",
  );
  let background = null;
  let resizePending = true;
  let pixelRatio = 0;

  function resizeCanvas(dpr) {
    resizePending = false;
    pixelRatio = dpr;
    const bounds = canvas.getBoundingClientRect();
    // Display size and DPR only affect the backing store, never gameplay.
    const width = Math.max(1, Math.round(bounds.width * dpr));
    const height = Math.max(1, Math.round(bounds.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    ctx.setTransform(width / CONFIG.width, 0, 0, height / CONFIG.height, 0, 0);
    background = ctx.createLinearGradient(0, 0, 0, CONFIG.height);
    background.addColorStop(0, BRAND_TOKENS.ink);
    background.addColorStop(.57, BRAND_TOKENS.navy);
    background.addColorStop(1, BRAND_TOKENS.ink);
  }

  function renderBackground(travel) {
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

    // Two reusable layers: a slow skyline and the faster floor grid.
    const offset = (travel * .08) % CONFIG.width;
    ctx.save();
    ctx.fillStyle = BRAND_TOKENS.ink;
    ctx.globalAlpha = .36;
    ctx.translate(-offset, 0);
    ctx.fill(city);
    ctx.translate(CONFIG.width, 0);
    ctx.fill(city);
    ctx.restore();

    ctx.strokeStyle = BRAND_TOKENS.sea;
    ctx.globalAlpha = .34;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const gridOffset = (travel * .34) % 64;
    for (let x = -64; x <= CONFIG.width + 64; x += 64) {
      ctx.moveTo(CONFIG.width * .5 + (x - gridOffset - CONFIG.width * .5) * .2, 412);
      ctx.lineTo(x - gridOffset, CONFIG.bottom);
    }
    for (let y = 421, spacing = 10; y < CONFIG.bottom; y += spacing, spacing *= 1.35) {
      ctx.moveTo(0, y);
      ctx.lineTo(CONFIG.width, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function renderGate(gate, x) {
    const width = CONFIG.gateWidth;
    const upperHeight = gate.top - CONFIG.top;
    const lowerHeight = CONFIG.bottom - gate.bottom;
    ctx.fillStyle = BRAND_TOKENS.panel;
    ctx.fillRect(x, CONFIG.top, width, upperHeight);
    ctx.fillRect(x, gate.bottom, width, lowerHeight);
    ctx.fillStyle = BRAND_TOKENS.sea;
    ctx.fillRect(x, CONFIG.top, 2, upperHeight);
    ctx.fillRect(x + width - 2, CONFIG.top, 2, upperHeight);
    ctx.fillRect(x, gate.bottom, 2, lowerHeight);
    ctx.fillRect(x + width - 2, gate.bottom, 2, lowerHeight);
    ctx.fillStyle = BRAND_TOKENS.line;
    for (let y = gate.top - 30; y > CONFIG.top + 8; y -= 19) ctx.fillRect(x + 11, y, width - 22, 2);
    for (let y = gate.bottom + 28; y < CONFIG.bottom - 8; y += 19) ctx.fillRect(x + 11, y, width - 22, 2);

    // Endcaps mark the same edges the collision test uses.
    ctx.fillStyle = gate.scored ? BRAND_TOKENS.sage : BRAND_TOKENS.gold;
    ctx.fillRect(x, gate.top - 2, width, 2);
    ctx.fillRect(x, gate.bottom, width, 2);
    for (let stripe = 0; stripe < 3; stripe++) {
      ctx.fillRect(x + 9 + stripe * 8, gate.top - 12, 3, 5);
      ctx.fillRect(x + 9 + stripe * 8, gate.bottom + 7, 3, 5);
    }
  }

  function renderParticles(alpha) {
    if (motion.matches) return;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      ctx.globalAlpha = p.life / p.duration;
      ctx.fillStyle = p.color;
      ctx.fillRect(mix(p.prevX, p.x, alpha), mix(p.prevY, p.y, alpha), p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function renderDrone(y, vy) {
    ctx.save();
    ctx.translate(player.x, y);
    if (recovery > 0) {
      ctx.strokeStyle = BRAND_TOKENS.sage;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.rotate(clamp(vy / 820, -.4, .49));
    ctx.fillStyle = BRAND_TOKENS.gold;
    ctx.fillRect(-21, -1.5, 6, 3);
    ctx.fillStyle = BRAND_TOKENS.cream;
    ctx.fill(droneHull);
    ctx.fillStyle = BRAND_TOKENS.navy;
    ctx.fill(droneWing);
    ctx.fillStyle = BRAND_TOKENS.sea;
    ctx.fillRect(3, -6, 5, 2);
    ctx.strokeStyle = BRAND_TOKENS.sage;
    ctx.lineWidth = 1;
    ctx.stroke(droneHull);
    ctx.restore();
  }

  function render(alpha) {
    const travel = motion.matches ? 0 : mix(prevDistance, distance, alpha);
    renderBackground(travel);
    ctx.save();
    if (shake > 0 && !motion.matches && machine.phase === PHASE.RUNNING) {
      ctx.translate(Math.sin(tick * 4.1) * shake * 5, Math.cos(tick * 5.7) * shake * 4);
    }
    invoke("onRenderBackground");
    renderParticles(alpha);
    for (let i = 0; i < gates.length; i++) {
      const gate = gates[i];
      if (gate.active) renderGate(gate, mix(gate.prevX, gate.x, alpha));
    }
    renderDrone(mix(player.prevY, player.y, alpha), mix(player.prevVy, player.vy, alpha));
    invoke("onRenderEntities");
    ctx.restore();
  }

  // === AI PROMPT ZONE: INPUT & PAUSE ===
  function changePhase(next) {
    if (!machine.transition(next)) return false;
    document.body.dataset.phase = next;
    ui.overlay.hidden = next === PHASE.RUNNING;
    ui.pause.disabled = next !== PHASE.RUNNING && next !== PHASE.PAUSED;
    ui.pause.textContent = next === PHASE.PAUSED ? "Resume" : "Pause";
    switch (next) {
      case PHASE.RUNNING:
        ui.announcer.textContent = "Flight in progress.";
        break;
      case PHASE.PAUSED:
        ui.title.textContent = "Flight paused";
        ui.detail.textContent = "Resume when you’re ready.";
        ui.actionLabel.textContent = "Resume flight";
        ui.announcer.textContent = "Flight paused.";
        break;
    }
    return true;
  }

  let lastTime = null;
  let accumulator = 0;

  function resetClock() {
    lastTime = null;
    accumulator = 0;
  }

  function pauseFlight() {
    if (!changePhase(PHASE.PAUSED)) return;
    thrustQueued = false;
    resetClock();
  }

  function resumeFlight() {
    if (document.hidden || !changePhase(PHASE.RUNNING)) return;
    // Hold the exact pause pose until the first new fixed tick.
    player.prevY = player.y;
    player.prevVy = player.vy;
    prevDistance = distance;
    for (let i = 0; i < gates.length; i++) gates[i].prevX = gates[i].x;
    for (let i = 0; i < particles.length; i++) {
      particles[i].prevX = particles[i].x;
      particles[i].prevY = particles[i].y;
    }
    resetClock();
  }

  function flightInput() {
    if (document.hidden) return;
    sound.unlock();
    if (machine.phase === PHASE.PAUSED) {
      resumeFlight();
      return;
    }
    if (machine.phase !== PHASE.RUNNING) {
      resetRun();
      changePhase(PHASE.RUNNING);
      resetClock();
    }
    thrustQueued = true;
  }

  function togglePause() {
    if (machine.phase === PHASE.RUNNING) pauseFlight();
    else if (machine.phase === PHASE.PAUSED && !document.hidden) {
      sound.unlock();
      resumeFlight();
    }
  }

  function toggleMute() {
    ui.mute.setAttribute("aria-pressed", String(sound.toggle()));
  }

  function handleKey(event) {
    if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target instanceof HTMLElement &&
        (target.isContentEditable || target.closest("input, textarea, select"))) return;
    const key = event.key.toLowerCase();
    if (key === "shift") { if (!event.repeat) queueDash(); event.preventDefault(); return; }
    const isThrust = key === " " || key === "arrowup";
    if (isThrust && key === " " && target instanceof HTMLElement && target.closest("button, a")) return;
    if (!isThrust && key !== "p" && key !== "m") return;
    event.preventDefault();
    if (event.repeat) return;
    if (isThrust) {
      const previous = machine.phase;
      flightInput();
      if (previous !== PHASE.RUNNING) canvas.focus({ preventScroll: true });
    } else if (key === "p") togglePause();
    else if (key === "m") toggleMute();
  }

  // The clamped real delta feeds a fixed-step accumulator. Rendering can happen
  // at any refresh rate. The same seed and per-tick input give the same flight.
  function frame(timestamp) {
    const dpr = window.devicePixelRatio || 1;
    if (resizePending || pixelRatio !== dpr) resizeCanvas(dpr);
    const elapsed = lastTime === null ? 0 : (timestamp - lastTime) / 1000;
    const dt = clamp(elapsed, 0, CONFIG.maxFrameDelta);
    lastTime = timestamp;

    if (machine.phase === PHASE.RUNNING) {
      accumulator += dt;
      // An epsilon avoids dropping a tick to floating-point summation noise.
      while (accumulator + 1e-9 >= CONFIG.step && machine.phase === PHASE.RUNNING) {
        accumulator = Math.max(0, accumulator - CONFIG.step);
        simulate(CONFIG.step);
      }
    } else {
      accumulator = 0;
    }
    const alpha = machine.phase === PHASE.RUNNING ? accumulator / CONFIG.step : 1;
    render(alpha);
    requestAnimationFrame(frame);
  }

  Object.defineProperties(window, {
    UoPGame: { value: Object.freeze({
      config: CONFIG, brand: BRAND_TOKENS, state: stateView, mods: GameModAPI,
    }), configurable: true },
    GameModAPI: { value: GameModAPI, configurable: true },
  });

  // Pointer input flaps immediately. Play remains a native keyboard-accessible button.
  canvas.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    flightInput();
    canvas.focus({ preventScroll: true });
  });
  ui.action.addEventListener("click", () => {
    flightInput();
    canvas.focus({ preventScroll: true });
  });
  ui.pause.addEventListener("click", () => {
    togglePause();
    if (machine.phase === PHASE.RUNNING) canvas.focus({ preventScroll:true });
  });
  ui.mute.addEventListener("click", () => {
    toggleMute();
    canvas.focus({ preventScroll:true });
  });
  window.addEventListener("keydown", handleKey);
  window.addEventListener("blur", pauseFlight);
  window.addEventListener("resize", () => { resizePending = true; });
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(() => { resizePending = true; }).observe(canvas);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pauseFlight();
    resetClock();
  });

  // === AI PROMPT ZONE: FIREWALL CORE BOSS ===
  const boss = { phase: "IDLE", clock: 0, shot: 0, nextShot: 0, y: 320 };
  const projectiles = Array.from({ length: 42 }, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0 }));
  const projectileRadius = 7;
  const lanes = [90, 165, 240, 320, 400, 475, 550];
  let dash = 0;
  let cooldown = 0;
  let dashQueued = false;
  let dashDirection = -1;
  let shake = 0;

  function resetBoss() {
    boss.phase = "IDLE";
    boss.clock = boss.nextShot = boss.shot = 0;
    dash = cooldown = shake = 0;
    dashQueued = false;
    for (const projectile of projectiles) projectile.life = 0;
  }

  function startBoss() {
    boss.phase = "TELEGRAPH";
    boss.clock = boss.shot = 0;
    boss.y = 320;
    shake = .25;
    for (const gate of gates) gate.active = false;
    sound.play("record");
  }

  function addShot(x, y, vx, vy) {
    const projectile = projectiles.find((item) => item.life <= 0);
    if (!projectile) return;
    projectile.x = x;
    projectile.y = y;
    projectile.vx = vx;
    projectile.vy = vy;
    projectile.life = 4.5;
  }

  function firePattern() {
    const safeLane = (boss.shot * 2 + 2) % lanes.length;
    if (boss.shot % 3 === 2) {
      const vy = clamp((player.y - boss.y) * 1.1, -165, 165);
      for (let offset = -1; offset <= 1; offset++) {
        addShot(408, boss.y, -150, vy + offset * 40);
      }
    } else {
      for (let lane = 0; lane < lanes.length; lane++) {
        if (Math.abs(lane - safeLane) > 1) addShot(408, lanes[lane], -160, 0);
      }
    }
    boss.shot++;
    shake = .13;
  }

  function queueDash() {
    if (machine.phase !== PHASE.RUNNING || cooldown > 0) return;
    dashQueued = true;
  }
  byId("mod-toggle").addEventListener("click", () => {
    queueDash();
    canvas.focus({ preventScroll:true });
  });


  function bossHitsPlayer() {
    if (dash > 0 || boss.phase === "IDLE") return false;
    for (const projectile of projectiles) {
      if (projectile.life <= 0) continue;
      const dx = Math.max(0, Math.abs(projectile.x - player.x) - CONFIG.playerHalfWidth);
      const dy = Math.max(0, Math.abs(projectile.y - player.y) - CONFIG.playerHalfHeight);
      if (dx * dx + dy * dy <= projectileRadius * projectileRadius) return true;
    }
    return false;
  }

  GameModAPI.register("overclock-boss-protocol", {
    onUpdate(dt) {
      byId("mod-toggle").textContent = cooldown > 0 ? "Dash charging" : "Dash";
      byId("mod-toggle").disabled = machine.phase !== PHASE.RUNNING || cooldown > 0;
      cooldown = Math.max(0, cooldown - dt);
      dash = Math.max(0, dash - dt);
      shake = Math.max(0, shake - dt);
      if (dashQueued && cooldown === 0) {
        dash = .16;
        cooldown = 1.35;
        dashDirection = player.vy > 80 ? 1 : -1;
        shake = .23;
        sound.play("flap");
        for (let i = 0; i < 14; i++) {
          const spread = (i - 7) / 7;
          emitParticle(player.x, player.y, spread * 150, -dashDirection * (120 + Math.abs(spread) * 125),
            .42, 2 + i % 3, i % 2 ? BRAND_TOKENS.sea : BRAND_TOKENS.gold);
        }
      }
      dashQueued = false;
      if (stateView.tick === 1) startBoss();
      if (boss.phase === "IDLE") return;
      boss.clock += dt;
      boss.y = 320 + Math.sin(boss.clock * 2) * 87;
      if (boss.phase === "TELEGRAPH" && boss.clock >= 2.25) {
        boss.phase = "ACTIVE";
        boss.clock = 0;
        boss.nextShot = 0;
      }
      if (boss.phase === "ACTIVE") {
        if (boss.clock >= 8.8) {
          boss.phase = "RECOVERY";
          boss.clock = 0;
        } else if (boss.clock >= boss.nextShot) {
          firePattern();
          boss.nextShot += 1.5;
        }
      }
      if (boss.phase === "RECOVERY" && boss.clock >= 2.8) {
        boss.phase = "IDLE";
        boss.clock = 0;
        player.y = player.prevY = CONFIG.playerY;
        player.vy = player.prevVy = 0;
        recovery = CONFIG.recoverySeconds;
        spawnGate(CONFIG.firstGateX);
      }
      for (const projectile of projectiles) {
        if (projectile.life <= 0) continue;
        projectile.x += projectile.vx * dt;
        projectile.y += projectile.vy * dt;
        projectile.life -= dt;
      }
    },
    onScore(total) {
      if (total % 3 === 0 && boss.phase === "IDLE") startBoss();
    },
    onCollision() {
      shake = .12;
      for (const projectile of projectiles) projectile.life = 0;
    },
    onRenderEntities(context) {
      if (machine.phase !== PHASE.RUNNING && machine.phase !== PHASE.PAUSED) return;
      context.font = "600 18px system-ui, sans-serif";
      context.fillStyle = BRAND_TOKENS.cream;
      context.textAlign = "center";
      if (boss.phase === "TELEGRAPH") context.fillText("Get ready…", CONFIG.width / 2, 85);
      else if (boss.phase === "RECOVERY") context.fillText("Wave cleared!", CONFIG.width / 2, 85);
      context.textAlign = "left";
      if (boss.phase === "IDLE") return;
      context.translate(406, boss.y);
      context.strokeStyle = BRAND_TOKENS.gold;
      context.fillStyle = BRAND_TOKENS.ink;
      context.lineWidth = 2;
      context.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = i * Math.PI / 3;
        context.lineTo(Math.cos(angle) * 36, Math.sin(angle) * 36);
      }
      context.closePath();
      context.fill();
      context.stroke();
      context.beginPath();
      context.arc(0, 0, 14, 0, 2 * Math.PI);
      context.fillStyle = BRAND_TOKENS.gold;
      context.fill();
      context.translate(-406, -boss.y);
      for (const projectile of projectiles) {
        if (projectile.life <= 0) continue;
        context.globalAlpha = .35;
        context.fillRect(projectile.x, projectile.y - 1, 24, 2);
        context.globalAlpha = 1;
        context.beginPath();
        context.arc(projectile.x, projectile.y, projectileRadius, 0, 2 * Math.PI);
        context.fill();
      }
    },
  });

  spawnGate(CONFIG.firstGateX);
  syncScore();

  ui.mute.setAttribute("aria-pressed", String(sound.muted));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
